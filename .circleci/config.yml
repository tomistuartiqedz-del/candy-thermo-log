version: 2.1

jobs:
  normalizeFailed:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create fixture B
          command: |
            mkdir -p /tmp/run.d
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=100000;i++) printf "%d %04d\n", i, i*i%10000}' > /tmp/run.d/5f918771358f4b25ff50271; true
            # metric
            echo "metric.stage_bytes=$(wc -c </tmp/run.d/5f918771358f4b25ff50271)"
      - persist_to_workspace:
          root: /tmp/run.d
          paths:
            - '5f918771358f4b25ff50271'
  strated:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run.d
      - run:
          name: Open blob
          command: |
            awk '/./{n++}END{print "nonempty:",n+0}' /tmp/run.d/5f918771358f4b25ff50271 2>/dev/null || true
      - run:
          name: Prepare source
          command: git clone -q --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Checkout vendored deps
          command: tar xzf package.tgz
      - run:
          name: Settle filesystem
          command: sleep 15
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          no_output_timeout: 93m
          command: (./tester)
